name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VRCFaceTracking.sln

      - name: Build
        run: dotnet build VRCFaceTracking.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VRCFaceTracking.sln --configuration Release --no-build --no-restore

name: Steam Publish
on:
  push:
    branches:
      - master
      - 'refactor/avalonia'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #- name: Install Crowdin CLI
      #  run: npm install -g @crowdin/cli

      #- name: Download latest translations
      #  run: crowdin download
      #  env:
      #    CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Windows (x64)
        run: |
          dotnet publish VRCFaceTracking/VRCFaceTracking.csproj --configuration Release -r win-x64 --self-contained false --output ./publish/windows
          dotnet publish VRCFaceTracking.ModuleProcess/VRCFaceTracking.ModuleProcess.csproj --configuration Release -r win-x64 --self-contained false --output ./publish/windows

      - name: Publish Linux (x64)
        run: |
          dotnet publish VRCFaceTracking/VRCFaceTracking.csproj --configuration Release -r linux-x64 --self-contained true --output ./publish/linux
          dotnet publish VRCFaceTracking.ModuleProcess/VRCFaceTracking.ModuleProcess.csproj --configuration Release -r linux-x64 --self-contained true --output ./publish/linux

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-windows
          path: publish/windows/**

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-linux
          path: publish/linux/**

      - name: Get version
        id: package_version
        uses: KageKirin/get-csproj-version@v1.0.0
        with:
          file: Directory.Build.props
          xpath: //PropertyGroup/AssemblyVersion
          regex: '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)\.(?<build>0|[1-9]\d*)$'

      - name: Determine Steam branch
        id: steam_branch
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "$REF_NAME" = "master" ]; then
            BRANCH="development"
          else
            BRANCH="${REF_NAME##*/}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Publishing to Steam branch: $BRANCH"

      - name: Deploy to Steam
        if: github.event_name == 'push'
        env:
          steam_username: ${{ secrets.STEAM_USERNAME }}
          steam_config_vdf: ${{ secrets.STEAM_CONFIG_VDF }}
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 3329480
          buildDescription: ${{ steps.package_version.outputs.version }}
          depot1Path: publish/windows
          depot2Path: publish/linux
          releaseBranch: ${{ steps.steam_branch.outputs.branch }}
